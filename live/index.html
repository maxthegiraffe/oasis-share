<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <link rel="canonical" href="https://grateful.gg/ai/live/" />
    <meta http-equiv="refresh" content="0;url=/ai/live/" />
    <script>
        (function() {
            var targetPath = '/ai/live/';
            var queryString = window.location.search;
            var hash = window.location.hash;
            window.location.replace(targetPath + queryString + hash);
        })();
    </script>
</head>
<body>
    <p>Redirecting to <a href="/ai/live/">https://grateful.gg/ai/live/</a>...</p>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="giraffe-shop-api" content="">
<meta name="robots" content="noindex">
<title>Thank you · The Giraffe Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:wght@400;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;font-family:'Libre Bodoni',Georgia,serif;color:#1c1917;background:#fffbeb;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .box{max-width:560px;text-align:center}
  h1{font-size:clamp(34px,6vw,52px);margin:0 0 16px}
  p{font-size:18px;line-height:1.6;color:#57534e}
  a{color:#b45309}
</style>
</head>
<body>
<div class="box">
  <h1 id="title">Thank you!</h1>
  <p id="msg">Your payment went through. Checking on your order…</p>
  <p><a href="/shop/">Back to the Giraffe Shop</a></p>
</div>
<script>
(function () {
  var API = document.querySelector('meta[name="giraffe-shop-api"]').content;
  var sessionId = new URLSearchParams(location.search).get('session_id');
  var msg = document.getElementById('msg');
  var tries = 0;
  function show(o) {
    var what = o.artworkTitle ? '“' + o.artworkTitle + '”' + (o.productLabel ? ' (' + o.productLabel + ')' : '') : 'your giraffe';
    if (o.status === 'shipped') msg.textContent = what + ' has shipped. Your tracking link is in your inbox.';
    else if (o.status === 'canceled') msg.textContent = 'This order was canceled. We have emailed you the details.';
    else msg.textContent = 'Your order for ' + what + ' is in. It is printed to order, and we will email you the tracking link when it ships.';
  }
  function poll() {
    if (!sessionId) { msg.textContent = 'Your payment went through. Your confirmation email is on its way.'; return; }
    fetch(API + '/api/orders/by-session/' + encodeURIComponent(sessionId))
      .then(function (r) { if (!r.ok) throw new Error(String(r.status)); return r.json(); })
      .then(show)
      .catch(function () {
        if (++tries < 10) setTimeout(poll, 2000);
        else msg.textContent = 'Your payment went through. Your confirmation email is on its way.';
      });
  }
  poll();
})();
</script>
</body>
</html>

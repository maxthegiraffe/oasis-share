<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Safari · The Oasis</title>

<!-- Any grateful.gg path that has no static page lands here. Crawlers get the
     preview below; humans get bounced straight to the same path on the app.
     This is what makes every referral link work, including ones minted after
     the share pages were last generated. -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Grateful Giraffes" />
<meta property="og:title" content="AI Safari" />
<meta property="og:description" content="Sunday, August 9 · 1–8pm · Primal Moves, Venice. One afternoon, six guides, and you leave with the thing you made." />
<meta property="og:image" content="https://grateful.gg/aisafari/cover.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="AI Safari" />
<meta name="twitter:description" content="Sunday, August 9 · 1–8pm · Primal Moves, Venice." />
<meta name="twitter:image" content="https://grateful.gg/aisafari/cover.jpg" />

<script>
  // Mirror the path onto the app: grateful.gg/aisafari/bradley
  //                            -> app.grateful.gg/aisafari/bradley
  (function () {
    try {
      var p = window.location.pathname || '/';
      var q = window.location.search || '';
      window.location.replace('https://app.grateful.gg' + p + q);
    } catch (e) {
      window.location.href = 'https://app.grateful.gg/aisafari';
    }
  })();
</script>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#f5f2ea; color:#0f0f0f; font-family:'Space Grotesk',ui-sans-serif,system-ui,sans-serif; }
  .w { text-align:center; padding:32px; }
  a { color:#ec4899; font-weight:700; text-decoration:none; }
</style>
</head>
<body>
  <div class="w">
    <p>Taking you to the AI Safari…</p>
    <p><a id="fallback" href="https://app.grateful.gg/aisafari">Continue &rarr;</a></p>
  </div>
  <script>
    document.getElementById('fallback').href =
      'https://app.grateful.gg' + (window.location.pathname || '/aisafari');
  </script>
</body>
</html>

    "America/Monterrey":"MX","America/Tijuana":"MX"};
  var code = "", tz = "";
  try { var saved = localStorage.getItem("ouaty-store"); if (saved && STORES[saved]) code = saved; } catch (e) {}

    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) {}

    else if (/^America\/(Toronto|Vancouver|Edmonton|Winnipeg|Halifax|St_Johns|Regina|Montreal|Moncton|Whitehorse|Yellowknife|Iqaluit|Glace_Bay|Goose_Bay|Swift_Current|Dawson_Creek|Fort_Nelson|Rankin_Inlet|Cambridge_Bay|Inuvik|Atikokan|Thunder_Bay|Nipigon|Rainy_River)$/.test(tz)) code = "CA";

      var lang = (navigator.languages && navigator.languages[0]) || navigator.language || "";
      var m = lang.match(/[-_]([a-z]{2})$/i);
      code = m && STORES[m[1].toUpperCase()] ? m[1].toUpperCase() : "US";
    }

  var st = STORES[code] || STORES.US;
  var url = "https://" + (st[1] ? st[0] : "www.amazon.com") + "/dp/" + ASIN;

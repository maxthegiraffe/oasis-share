name: events card
# Rebuilds the grateful.gg/events link preview from the live calendar every morning (Max, 2026-11-19: "events
# preview should be next up with dates and change dynamically"). scripts/events_card.py only commits when the next
# four gatherings, or their art, changed.
on:
  schedule:
    - cron: "7 13 * * *"   # 5:07 AM PT
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: events-card
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            events
            scripts
      - run: pip install --quiet pillow
      - name: Draw the card
        run: python3 scripts/events_card.py
      - name: Commit if it changed
        run: |
          git config user.name "grateful-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A events
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "events: next-up card from the live calendar"
          git pull --rebase origin main
          git push origin HEAD:main

<!-- The AI door (Max, 2026-11-03: "gigi being available for anyone to have a free AI discovery call"). Opens Messages to
     Gigi's (516) 419-7249 line with AI already typed; Gigi runs the discovery (gigi-whatsapp functions/ai_discovery.private.js).
     iOS takes "&body=", everyone else "?body=". Same pattern as /textsafari. -->
<script>
  var SMS = /iPad|iPhone|iPod|Macintosh/.test(navigator.userAgent) ? "sms:+15164197249&body=AI" : "sms:+15164197249?body=AI";
  setTimeout(function(){ try{ window.location.href = SMS; }catch(e){} }, 400);
  document.addEventListener("DOMContentLoaded", function(){ document.querySelectorAll("a[data-sms]").forEach(function(a){ a.href = SMS; }); });
</script>

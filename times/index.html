<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0a18">
<title>Share when you're free · Gigi</title>
<meta name="description" content="One tap so Gigi can find a time that works. She only sees busy or free.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Grateful Giraffes">
<meta property="og:title" content="Find a time with Gigi">
<meta property="og:description" content="One tap from your Google Calendar. No event names, guests or details.">
<meta property="og:url" content="https://grateful.gg/times/">
<meta property="og:image" content="https://grateful.gg/times/cover.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Gigi the giraffe beside the words Share when you're free">
<meta name="twitter:card" content="summary_large_image">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<!-- The times link (Max, 2026-11-16; words approved). Gigi texts grateful.gg/times/?t=<10 chars>, made for one phone, single use,
     7 days (gigi-whatsapp functions/times_link.private.js). The button goes to Google with only the calendar.freebusy scope on the
     verified "Oasis sign-in" client (GCP oasis-sign-in-511422), so there is no "unverified app" screen. Google comes back here
     with ?code&state; the code goes to the Worker (gigi-cloud /times/exchange), which keeps the token for that phone. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink: #fff4e4; --soft: rgba(255, 244, 228, .82); --gold: #ffc878; --gold-hi: #ffd79c; --night: #0c0a18;
    --serif: "Fraunces", Georgia, serif; --sans: "Inter", system-ui, -apple-system, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--night); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  main { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px 20px max(24px, env(safe-area-inset-bottom)); max-width: 520px; margin: 0 auto; }
  .face { width: clamp(96px, 16svh, 140px); height: clamp(96px, 16svh, 140px); border-radius: 50%; object-fit: cover;
    border: 2px solid rgba(255, 200, 120, .55); box-shadow: 0 10px 36px rgba(0, 0, 0, .5); margin-bottom: 20px; }
  h1 { margin: 0 0 12px; font-family: var(--serif); font-weight: 600; line-height: 1.05; font-size: clamp(32px, 9vw, 48px); text-wrap: balance; }
  p { margin: 0 0 24px; font-size: 17px; line-height: 1.45; color: var(--soft); text-wrap: pretty; max-width: 26em; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; max-width: 380px; min-height: 58px; padding: 0 24px;
    border: 0; border-radius: 999px; background: var(--gold); color: #1a1208; font: 600 18px var(--sans); text-decoration: none; cursor: pointer;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .36); transition: transform .14s ease, background-color .14s ease; }
  .btn:hover { background: var(--gold-hi); }
  .btn:active { transform: scale(.98); }
  .btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .small { margin: 16px 0 0; font-size: 14px; color: rgba(255, 244, 228, .6); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <img class="face" src="/gigi.jpg" alt="Gigi" width="140" height="140">
  <h1 id="title">Share when you're free</h1>
  <p id="lede">Gigi only sees busy or free. Never event names, guests or details. You can stop anytime.</p>
  <a class="btn" id="go" href="#">Connect Google Calendar</a>
  <p class="small" id="note" hidden></p>
</main>
<script>
(function () {
  var CLIENT_ID = "24853682693-th2ok6q53mnvvid9f7vqkbrq313alpcf.apps.googleusercontent.com";
  var REDIRECT = "https://grateful.gg/times/";
  var SCOPE = "https://www.googleapis.com/auth/calendar.freebusy";
  var EXCHANGE = "https://gigi-cloud.gigi-grateful.workers.dev/times/exchange";
  var q = new URLSearchParams(location.search);
  var t = q.get("t") || q.get("state") || "";
  var $ = function (id) { return document.getElementById(id); };
  function googleUrl() {
    return "https://accounts.google.com/o/oauth2/v2/auth?" + new URLSearchParams({ client_id: CLIENT_ID, redirect_uri: REDIRECT,
      response_type: "code", scope: SCOPE, access_type: "offline", prompt: "consent", state: t }).toString();
  }
  function show(title, lede, button) {
    $("title").textContent = title;
    $("lede").textContent = lede;
    $("go").hidden = !button;
    if (button) { $("go").textContent = button; $("go").href = googleUrl(); }
  }
  // Keep the code out of the address bar, so a reload never posts it twice.
  if (q.get("code") || q.get("error")) history.replaceState(null, "", REDIRECT + (t ? "?t=" + encodeURIComponent(t) : ""));
  if (!/^[a-z0-9]{10}$/.test(t)) { show("This link isn't complete", "Ask Gigi for a new one and she'll text it right over.", ""); return; }
  if (q.get("error")) { show("No problem", "Nothing was shared. If you change your mind, it's one tap.", "Connect Google Calendar"); return; }
  if (!q.get("code")) { $("go").href = googleUrl(); return; }
  show("Connecting…", "One moment.", "");
  fetch(EXCHANGE, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ t: t, code: q.get("code") }) })
    .then(function (r) { return r.json(); })
    .then(function (r) {
      if (r && r.ok) return show("Done ✅", "Gigi can see when you're free now. You can close this.", "");
      if (r && r.error === "expired") return show("This link has expired", "Ask Gigi for a new one and she'll text it right over.", "");
      if (r && r.error === "scope") return show("One more try", "Google left the calendar box unticked. Tap below and tick it so Gigi can see when you're free.", "Try again");
      show("That didn't go through", "Google didn't finish connecting. Please try once more.", "Try again");
    })
    .catch(function () { show("That didn't go through", "Your connection dropped. Please try once more.", "Try again"); });
})();
</script>
</body>
</html>

[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ground);color:var(--ink);font-family:'DM Sans',system-ui,-apple-system,sans-serif}
button,select{font-family:inherit}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.serif{font-family:'Libre Bodoni',Georgia,'Times New Roman',serif}

/* stage */
#stage{position:fixed;inset:0;background:var(--stage);overflow:hidden}
#stage img{position:absolute;inset:0;width:100%;height:100%;max-width:100%;object-fit:cover;opacity:0;transition:opacity .9s ease;transform-origin:50% 55%}
#stage img.on{opacity:1}
#stage img.kb{animation:kb 9s ease-out forwards}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.06)}}
#stage .scrim{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(20,16,12,.38) 0%,rgba(20,16,12,0) 26%,rgba(20,16,12,0) 58%,rgba(20,16,12,.55) 100%)}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
body.plan #stage img,body.plan #stage .scrim{display:none}

/* brand + space card */
.brand{position:fixed;left:18px;top:calc(16px + env(safe-area-inset-top,0px));z-index:5;width:min(390px,calc(100vw - 36px))}
.brand .eyebrow{font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#fde2ec;text-shadow:0 1px 8px rgba(0,0,0,.35)}
.brand h1{font-family:'Libre Bodoni',Georgia,serif;font-weight:500;font-size:clamp(32px,4.4vw,50px);line-height:1;margin:4px 0 10px;color:#fffaf4;text-shadow:0 2px 18px rgba(0,0,0,.35)}
body.plan .brand .eyebrow{color:var(--pink);text-shadow:none} body.plan .brand h1{color:var(--ink);text-shadow:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.space{padding:12px 14px}
.space .row{display:flex;align-items:center;gap:8px}
.icon{width:34px;height:34px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--btn);color:var(--ink);cursor:pointer;font-size:16px;line-height:1}
.space select{flex:1;min-width:0;font-size:15px;font-weight:600;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--btn)}
.space .addr{margin:10px 2px 0;font-weight:700;font-size:15px}
.space .sub{margin:2px 2px 0;font-size:13px;color:var(--soft);line-height:1.45;font-variant-numeric:tabular-nums}
.space .acts{display:flex;gap:8px;margin-top:10px}
.pillbtn{font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--btn);color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.pillbtn.primary{background:var(--ink);color:var(--solid);border-color:var(--ink)}

/* caption */
.caption{position:fixed;left:18px;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:5;width:min(460px,calc(100vw - 36px));padding:16px 18px}
.caption .eb{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--pink)}
.caption h2{font-family:'Libre Bodoni',Georgia,serif;font-weight:500;font-size:34px;line-height:1.05;margin:6px 0 8px;text-wrap:balance}
.caption p{margin:0 0 8px;color:var(--soft);font-size:15px;line-height:1.5}
.caption ul{margin:0;padding-left:18px;font-size:14px;line-height:1.55;color:var(--ink);font-variant-numeric:tabular-nums}
.caption .cap{margin-top:8px;font-size:11px;color:var(--muted)}

/* bottom bar */
.bar{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:6;display:flex;gap:4px;flex-wrap:wrap;justify-content:center;padding:6px;border-radius:999px;max-width:calc(100vw - 20px)}
.bar button{font-size:14px;font-weight:600;border:0;border-radius:999px;padding:9px 12px;cursor:pointer;background:transparent;color:var(--ink);display:flex;align-items:center;gap:7px;white-space:nowrap}
.bar button:hover{background:var(--chip)}
.bar button.on{background:var(--ink);color:var(--solid)}
.bar .dot{width:10px;height:10px;border-radius:50%;display:inline-block;border:1px solid rgba(38,33,27,.25)}
.bar .sep{width:1px;background:var(--line);margin:4px 2px}

/* 3D tags */
.tag{position:fixed;z-index:4;transform:translate(-50%,-100%);cursor:pointer;user-select:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 12px 7px;text-align:center;box-shadow:var(--shadow);white-space:nowrap;color:var(--ink)}
.tag b{display:block;font-family:'Libre Bodoni',Georgia,serif;font-size:18px;font-weight:600;line-height:1.1}
.tag span{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.tag i{position:absolute;left:50%;bottom:-6px;width:10px;height:10px;background:var(--solid);border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.tag.dim{opacity:.35}
.tag.lvl{cursor:default;background:#26211b;color:#fbf3ea;padding:5px 10px}.tag.lvl b{font-size:14px;font-family:'DM Sans',sans-serif}.tag.lvl i{background:#26211b;border:0}
body:not(.plan) #tags{display:none}

/* drawer */
.drawer{position:fixed;right:14px;top:calc(14px + env(safe-area-inset-top,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100vw - 28px));z-index:8;
  background:var(--solid);border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 50px rgba(20,16,12,.28);display:flex;flex-direction:column;transform:translateX(115%);transition:transform .35s ease}
.drawer.open{transform:none}
.drawer header{padding:16px 18px 0;display:flex;gap:10px;align-items:flex-start}
.drawer header .t{flex:1;min-width:0}
.drawer header .eb{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--pink)}
.drawer header h2{font-family:'Libre Bodoni',Georgia,serif;font-weight:500;font-size:28px;line-height:1.1;margin:4px 0 0;text-wrap:balance}
.tabs{display:flex;gap:4px;padding:12px 18px 0;border-bottom:1px solid var(--line)}
.tabs button{font-size:14px;font-weight:600;border:0;background:transparent;color:var(--soft);padding:10px 12px;border-bottom:2px solid transparent;cursor:pointer}
.tabs button.on{color:var(--ink);border-bottom-color:var(--pink)}
.dbody{overflow:auto;padding:16px 18px 22px;flex:1}
.dbody h3{font-family:'Libre Bodoni',Georgia,serif;font-weight:500;font-size:20px;margin:18px 0 8px}
.dbody h3:first-child{margin-top:0}
.dbody p{margin:0 0 10px;color:var(--soft);font-size:14px;line-height:1.55}
.dbody ul{margin:0 0 6px;padding-left:18px;font-size:14px;line-height:1.6}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:14px;font-variant-numeric:tabular-nums}
.kv dt{color:var(--soft)} .kv dd{margin:0;text-align:right;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:6px}
.tile{background:var(--chip);border-radius:14px;padding:12px 14px}
.tile .v{font-family:'Libre Bodoni',Georgia,serif;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .l{font-size:12px;color:var(--soft);margin-top:4px;line-height:1.35}
.neg{color:var(--bad)} .pos{color:var(--good)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:700;border-radius:999px;padding:5px 10px;background:var(--chip);color:var(--ink)}
.chip.s-Strong{box-shadow:inset 0 0 0 1.5px var(--good)} .chip.s-Good{box-shadow:inset 0 0 0 1.5px var(--good)}

.tbl{overflow-x:auto;margin:0 0 6px}
.tbl table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left;white-space:normal}
.tbl th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);font-weight:700}
.tbl tr.total td{font-weight:700;border-bottom:0;border-top:1.5px solid var(--ink)}
.tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:var(--chip)} .tbl tr.cur td{background:var(--chip)}
.tbl .basis{display:block;font-size:11px;color:var(--muted);font-weight:400}
.map{width:100%;height:220px;border:0;border-radius:14px;display:block;margin:0 0 10px;background:var(--chip)}
.fine{font-size:12px!important;color:var(--muted)!important}
.private{display:flex;gap:8px;align-items:flex-start;background:var(--chip);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--soft);margin:0 0 12px;line-height:1.45}
.load{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:var(--ground);transition:opacity .5s ease}
.load div{font-family:'Libre Bodoni',Georgia,serif;font-size:24px;color:var(--soft)}

      if (area >= 500) { const sw = Math.min(7, w/3); box(x + 2, z + d - 3.4, sw, 2.6, 1.6, 0xe7a1b6, LOW); box(x + 2, z + d - 1.4, sw, .8, 2.8, 0xe7a1b6, LOW);

      if (f.includes('recovery') && area >= 700) { box(x + w - 4, z + 1.5, 2.4, 5, 2.2, 0xf5efe6, LOW); plane(8, 9, mat(0xf9b6c8, {t:.55, ds:true}), x + w - 6.5, 4.8 + LOW, z + 4, Math.PI/2); }
    }
    if (area > 160 && zone !== 'wc') planter(x + 1.8, z + 1.8, .7);
  }

  // tags (one per zone, on its largest room)
  for (const k of ORDER) {
    const rs = zoneRooms[k]; if (!rs) continue; const big = rs.reduce((m, r) => r.w*r.d > m.w*m.d ? r : m);
    const el = document.createElement('div'); el.className = 'tag'; el.innerHTML = `<b>${ZONES[k].name}</b><span>${ZONES[k].verb}</span><i></i>`;
    el.addEventListener('click', e => { e.stopPropagation(); select(k); }); tagWrap.appendChild(el);
    const [px, pz] = P(big.x + big.w/2, big.z + big.d/2); tags[k] = {el, p:new THREE.Vector3(px, 17, pz), look:new THREE.Vector3(px, 2, pz), size:Math.sqrt(big.w*big.d)};
  }
  const extent = Math.max(spanW, space.D, 88);

}


function zoneStats(k) {
  const all = [...S.rooms, ...(S.rooms2 || [])], tot = all.reduce((a, r) => a + r.w*r.d, 0);
  const sf = r => Math.round(r.w*r.d*S.sf/tot/10)*10, rs = all.filter(r => r.zone === k), area = rs.reduce((a, r) => a + sf(r), 0);
  const out = [`${area.toLocaleString()} sq ft${rs.length > 1 ? ` across ${rs.length} rooms` : ''}`];
  if (k === 'savanna') out.push(`About ${Math.floor(area/14/5)*5} standing or ${Math.floor(area/22/5)*5} seated`);
  if (k === 'canopy') { const c = rs.filter(r => /lass/.test(r.fn)).reduce((a, r) => a + Math.floor(sf(r)/24), 0); if (c) out.push(`${c} classroom seats`); if (rs.some(r => /tudio/.test(r.fn))) out.push('A podcast and content studio'); }
  if (k === 'acacia') out.push(`About ${rs.reduce((a, r) => a + Math.floor(sf(r)/60), 0)} founder seats`);
  if (k === 'oasis') { const c = rs.filter(r => !/itchen/.test(r.fn) || /bar|café/i.test(r.fn)).reduce((a, r) => a + Math.floor(sf(r)/25), 0); if (c) out.push(`About ${c} café and lounge seats`); }
  const fns = [...new Set(rs.map(r => r.fn).filter(Boolean))]; if (fns.length) out.push(fns.join(' · '));

}



// ---------- formatting ----------
const money = n => (n < 0 ? '−$' : '$') + Math.abs(Math.round(n)).toLocaleString('en-US');
const short = n => { const a = Math.abs(n), s = n < 0 ? '−$' : '$'; return a >= 1e6 ? s + (a/1e6).toFixed(2).replace(/0$/,'') + 'M' : s + Math.round(a/1e3) + 'K'; };
const cls = n => n < 0 ? 'neg' : 'pos';
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mapsUrl = s => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(`${s.addr}, ${s.city}, CA ${s.zip}`);
const imgFor = (s, v) => `img/${s.id}_${v}.jpg`;

// ---------- photos ----------
const A = $('#imgA'), B = $('#imgB'); let front = A;
function showImg(src, fallback, alt) {

  back.onerror = () => { back.onerror = null; back.src = fallback; };
  back.onload = () => { back.classList.remove('kb'); void back.offsetWidth; back.classList.add('on', 'kb'); front.classList.remove('on'); front = back; hideLoad(); };
  back.alt = alt; back.src = src;
}
let loaded = false; function hideLoad() { if (!loaded) { loaded = true; $('#load').classList.add('gone'); } }
setTimeout(hideLoad, 2500);

// ---------- caption ----------
function moveFor(s, k) { const n = ZONES[k].name.toLowerCase(); return (s.moves || []).find(m => m.toLowerCase().includes(n)); }
function setCaption() {

  }

}

// ---------- views, tour, modes ----------
function markBar() { document.querySelectorAll('#bar [data-zone]').forEach(b => b.classList.toggle('on', b.dataset.zone === view));
  $('#bOverview').classList.toggle('on', view === 'hero'); $('#bTour').classList.toggle('on', !!touring); $('#bWalls').classList.toggle('on', !wallsTall); }
function setView(v, fromTour=false) {
  if (!fromTour) stopTour();
  view = v; const s = SPACES[idx];
  setCaption(); markBar();
  if (mode === 'photos') showImg(imgFor(s, v), `img/${v}.jpg`, v === 'hero' ? `Concept cutaway of ${s.addr}` : `Concept image of ${ZONES[v].name} at ${s.addr}`);
  else plan3d(v);
}
function select(k) { setView(k); }            // called by 3D tags
function startTour() { if (touring) { stopTour(); markBar(); return; } let i = Math.max(0, VIEWS.indexOf(view));
  const go = () => { setView(VIEWS[i % VIEWS.length], true); i++; }; touring = setInterval(go, 5600); go(); markBar(); }
function stopTour() { if (touring) { clearInterval(touring); touring = null; } }
function step(d) { const i = VIEWS.indexOf(view); setView(VIEWS[(i + d + VIEWS.length) % VIEWS.length]); }

function setWalls(tall) { wallsTall = tall; wallMeshes.forEach(w => { w.scale.y = tall ? 1 : .32; w.position.y = (tall ? WALL_H : WALL_H*.32)/2 + LOW; }); markBar(); }
const ovPos = () => { const k = camera.aspect < 1 ? Math.min(2.3, 1.2/camera.aspect) : 1; return new THREE.Vector3(...S.overview.pos).multiplyScalar(k); };
const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2;
function fly(pos, look, dur=1400) { anim = {t0:performance.now(), dur, p0:camera.position.clone(), l0:controls.target.clone(), p1:pos.clone(), l1:look.clone()}; controls.autoRotate = false; }
function plan3d(v) {
  if (built !== idx) { build(SPACES[idx]); built = idx; camera.position.copy(ovPos()); controls.target.set(...S.overview.look); }
  for (const [zk, ms] of Object.entries(floorMeshes)) ms.forEach(m => { const c = zk === 'wc' ? WC_COLOR : ZONES[zk].color; m.material = mat(c, zk === v ? {e:c, ei:.35, r:.6} : {r:.6}); });
  if (v === 'hero' || !tags[v]) { fly(ovPos(), new THREE.Vector3(...S.overview.look)); setTimeout(() => { if (view === 'hero' && !touring && mode === 'plan') controls.autoRotate = true; }, 1500); }
  else { const t = tags[v], sz = Math.min(70, Math.max(32, t.size*1.5)); fly(t.look.clone().add(new THREE.Vector3(sz*.55, sz*.8, sz*.95)), t.look); }
}
function setMode(m) {
  mode = m; document.body.classList.toggle('plan', m === 'plan'); canvas.hidden = m !== 'plan'; $('#bWalls').hidden = m !== 'plan';
  $('#bMode').textContent = m === 'plan' ? 'Photos' : '3D plan';
  if (m === 'plan') { scene.background.set(stageColor()); resize(); }
  setView(view, !!touring);
}

// ---------- spaces ----------
const pick = $('#sPick');
SPACES.forEach((s, i) => { const o = document.createElement('option'); o.value = i; o.textContent = `${s.n}. ${s.addr} · ${s.hood}`; pick.appendChild(o); });
function loadSpace(i, keepView=false) {

  $('#sAddr').textContent = `${s.addr}, ${s.city} ${s.zip}`;

}

// ---------- details drawer ----------
let tab = 'listing';
function tbl(head, rows, opts={}) {
  return `<div class="tbl"><table><thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
}
function listingHTML(s) {
  const c = s.caps, map = PUBLIC_MAP ? `<iframe class="map" title="Map of ${esc(s.addr)}" loading="lazy" src="https://www.openstreetmap.org/export/embed.html?bbox=${s.lng-.008},${s.lat-.005},${s.lng+.008},${s.lat+.005}&layer=mapnik&marker=${s.lat},${s.lng}"></iframe>` : '';
  return `<h3>Location</h3>${map}<p><b style="color:var(--ink)">${esc(s.addr)}</b><br>${esc(s.city)}, CA ${esc(s.zip)} · ${esc(s.hood)}</p>
  <p><a class="pillbtn" href="${mapsUrl(s)}" target="_blank" rel="noopener">Open in Google Maps ↗</a></p>

    <dt>Asking rent a month</dt><dd>${s.askMo ? money(s.askMo) : 'On request'}</dd>
    <dt>Rent a year${s.askMo ? '' : ' (assumed)'}</dt><dd>${money(s.rentYr)}</dd>
    <dt>A year, per sq ft</dt><dd>${s.psf ? '$' + s.psf : '$59 (assumed)'}</dd>
    <dt>Lease</dt><dd>${esc(s.lease)}</dd></dl>
  <p class="fine" style="margin-top:8px">${esc(s.rentNote)}.</p>
  <h3>Highlights</h3><ul>${s.facts.map(f => `<li>${esc(f)}</li>`).join('')}</ul>
  <h3>What The Safari fits here</h3><div class="tiles">
    <div class="tile"><div class="v">${c.standing} / ${c.seated}</div><div class="l">Savanna, standing / seated</div></div>
    <div class="tile"><div class="v">${c.canopy}</div><div class="l">Canopy classroom seats</div></div>
    <div class="tile"><div class="v">${c.acacia}</div><div class="l">Acacia founder seats</div></div>
    <div class="tile"><div class="v">${c.oasis}</div><div class="l">Oasis café and lounge seats</div></div></div>
  <h3>Fit</h3><div class="chips">${Object.entries(s.scores).map(([k, v]) => `<span class="chip s-${esc(v)}">${esc(k)}: ${esc(v)}</span>`).join('')}</div>
  ${s.watch.length ? `<h3>Watch-outs</h3><ul>${s.watch.map(w => `<li>${esc(w)}</li>`).join('')}</ul>` : ''}
  <p class="fine" style="margin-top:14px">Listing data from SquareFoot, pulled Sept 23 2026. Asking terms change or get withdrawn; confirm with the listing broker. Zone capacities come from a schematic test-fit, not the building&#8217;s real plan.</p>`;
}
function numbersHTML(s) {
  const b = s.scenarios.base, y = s.years;
  const pay = p => p == null ? 'Not at this case' : p > 10 ? 'Over 10 years' : p + ' years';
  const budgetRows = Object.entries(s.budget).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${money(v)}</td></tr>`).concat(`<tr class="total"><td>Total to open</td><td>${money(s.budgetTotal)}</td></tr>`);
  const lineRows = Object.entries(s.lines).map(([k, v]) => `<tr><td>${esc(k)}<span class="basis">${esc(v.basis)}</span></td><td>${money(v.value)}</td></tr>`);
  const pl = lineRows.concat(
    `<tr class="total"><td>Revenue</td><td>${money(b.revenue)}</td></tr>`,
    `<tr><td>Program costs and card fees</td><td class="neg">${money(-b.variable)}</td></tr>`,
    `<tr><td>Rent</td><td class="neg">${money(-b.rent)}</td></tr>`,
    `<tr><td>Team: general manager, ops lead, cleaning and security</td><td class="neg">${money(-b.staff)}</td></tr>`,
    `<tr><td>Utilities, insurance, maintenance, software</td><td class="neg">${money(-b.opex)}</td></tr>`,
    `<tr class="total"><td>NOI</td><td class="${cls(b.noi)}">${money(b.noi)}</td></tr>`);
  const sc = ['conservative', 'base', 'upside'].map(k => { const v = s.scenarios[k];
    return `<tr><td>${k[0].toUpperCase() + k.slice(1)}<span class="basis">${k === 'conservative' ? '55% of base demand' : k === 'base' ? 'The case above' : '1.7× base demand'}</span></td><td>${money(v.revenue)}</td><td class="${cls(v.noi)}">${money(v.noi)}</td></tr>`; });
  const yr = [['Revenue', p => money(p.revenue)], ['Costs', p => money(-(p.variable + p.rent + p.staff + p.opex))], ['NOI', p => `<span class="${cls(p.noi)}">${money(p.noi)}</span>`]]
    .map(([n, f]) => `<tr><td>${n}</td>${y.map(p => `<td>${f(p)}</td>`).join('')}</tr>`)
    .concat(`<tr class="total"><td>Cumulative, after the startup budget</td>${s.cumulative.map(c => `<td class="${cls(c)}">${money(c)}</td>`).join('')}</tr>`);
  return `<div class="private">Private working numbers. Share them person to person, never on a public page, a list or a stage.</div>
  <div class="tiles">
    <div class="tile"><div class="v">${short(s.budgetTotal)}</div><div class="l">To open, including a 4-month reserve</div></div>
    <div class="tile"><div class="v ${cls(y[1].noi)}">${short(y[1].noi)}</div><div class="l">Year-2 NOI, base case</div></div>
    <div class="tile"><div class="v ${cls(s.scenarios.upside.noi)}">${short(s.scenarios.upside.noi)}</div><div class="l">Stabilized NOI, upside case</div></div>
    <div class="tile"><div class="v" style="font-size:18px">${pay(s.payback)}</div><div class="l">Payback at base · ${pay(s.paybackUpside)} at upside</div></div></div>

  <h3>Three cases</h3>${tbl(['Case', 'Revenue', 'NOI'], sc)}
  <h3>Three-year projection, base case</h3>${tbl(['', 'Year 1', 'Year 2', 'Year 3'], yr)}
  <h3>How these numbers work</h3><ul>
    <li>NOI here is operating profit after rent, before depreciation, interest and taxes.</li>
    <li>Year 1 runs at 65% of base demand while the calendar fills; year 3 at 112%. Rent, team and operations rise 3% a year.</li>
    <li>Revenue scales with this space&#8217;s capacity: classroom seats set cohort size, Savanna size sets event guests, sponsorship and rental rates.</li>
    <li>Venice and Santa Monica carry a 15% premium on tickets and rentals and $450 desks.</li>
    <li>Team is a general manager ($85K) and ops lead ($60K) with 20% burden, plus a $24K cleaning and security contract. You and the current team are not in these costs.</li>
    <li>Estimates, not a forecast or financial advice. Membership, rentals and desks have no history yet.</li></ul>`;
}
function allHTML() {
  const head = ['Space', 'Sq ft', 'Rent / yr'].concat(FIN ? ['To open', 'Yr-2 NOI', 'Upside NOI'] : ['Savanna']);
  const rows = SPACES.map((s, i) => `<tr class="click${i === idx ? ' cur' : ''}" data-i="${i}"><td><b>${s.n}. ${esc(s.addr)}</b><span class="basis">${esc(s.hood)}</span></td><td>${s.sf.toLocaleString()}</td><td>${money(s.rentYr)}${s.askMo ? '' : '*'}</td>` +
    (FIN ? `<td>${short(s.budgetTotal)}</td><td class="${cls(s.years[1].noi)}">${short(s.years[1].noi)}</td><td class="${cls(s.scenarios.upside.noi)}">${short(s.scenarios.upside.noi)}</td>` : `<td>${s.caps.standing}</td>`) + '</tr>');
  return `<p>Tap a row to open that space.</p>${tbl(head, rows)}<p class="fine">* Rent not listed; assumed at the Santa Monica median of $59 per sq ft a year.${FIN ? ' NOI is base case unless marked upside.' : ' Savanna shows standing capacity.'}</p>`;

}
if (!FIN) $('#tabNumbers').hidden = true;
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { tab = b.dataset.tab; renderDrawer(); });
$('#bDetails').onclick = () => { $('#drawer').classList.add('open'); renderDrawer(); };
$('#dClose').onclick = () => $('#drawer').classList.remove('open');

// ---------- wiring ----------
$('#bOverview').onclick = () => setView('hero');
document.querySelectorAll('#bar [data-zone]').forEach(b => b.onclick = () => setView(b.dataset.zone));
$('#bTour').onclick = startTour;
$('#bMode').onclick = () => setMode(mode === 'plan' ? 'photos' : 'plan');
$('#bWalls').onclick = () => setWalls(!wallsTall);
$('#sPrev').onclick = () => loadSpace(idx - 1, true);
$('#sNext').onclick = () => loadSpace(idx + 1, true);
pick.onchange = () => loadSpace(+pick.value, true);
controls.addEventListener('start', () => { anim = null; controls.autoRotate = false; stopTour(); markBar(); });
addEventListener('keydown', e => { if (e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowRight') step(1); if (e.key === 'ArrowLeft') step(-1); if (e.key === 'Escape') $('#drawer').classList.remove('open'); });

const v3 = new THREE.Vector3();
function placeTags() { const w = canvas.clientWidth, h = canvas.clientHeight;
  for (const [k, t] of Object.entries(tags)) { v3.copy(t.p).project(camera); t.el.style.display = v3.z < 1 ? '' : 'none';
    t.el.style.left = ((v3.x + 1)/2*w) + 'px'; t.el.style.top = ((1 - v3.y)/2*h) + 'px'; if (!t.lvl) t.el.classList.toggle('dim', view !== 'hero' && view !== k); } }
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w/h; camera.fov = w < 760 ? 52 : 38; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
function tick(now) {
  if (mode === 'plan') {
    if (anim) { const t = Math.min(1, (now - anim.t0)/anim.dur), k = ease(t); camera.position.lerpVectors(anim.p0, anim.p1, k); controls.target.lerpVectors(anim.l0, anim.l1, k); if (t >= 1) anim = null; }

}
requestAnimationFrame(tick);

const hashN = +((location.hash.match(/^#s(\d+)$/) || [])[1] || 0), queryN = +(new URLSearchParams(location.search).get('space') || 0);
const startN = hashN || queryN;
loadSpace(startN >= 1 && startN <= SPACES.length ? startN - 1 : 0);
addEventListener('hashchange', () => { const n = +((location.hash.match(/^#s(\d+)$/) || [])[1] || 0); if (n >= 1 && n <= SPACES.length && n - 1 !== idx) loadSpace(n - 1); });
const qz = new URLSearchParams(location.search).get('zone'); if (qz && ZONES[qz]) setTimeout(() => setView(qz), 400);

</script>

<style>
:root{
  --ink:#26211b; --soft:#6b6158; --muted:#8a7f74; --pink:#be185d; --line:rgba(38,33,27,.13);
  --card:rgba(255,250,244,.95); --solid:#fffaf4; --ground:#f3e7da; --chip:#f6ece1; --btn:#ffffff;
  --good:#3f7a3a; --warn:#b45309; --bad:#b4233a; --stage:#f3e7da;
  --shadow:0 10px 30px rgba(38,33,27,.14);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ink:#f6ece1; --soft:#cbbcab; --muted:#a8998a; --pink:#f9a8d4; --line:rgba(246,236,225,.14);
  --card:rgba(33,28,23,.93); --solid:#211c17; --ground:#171310; --chip:#2c251f; --btn:#2c251f;
  --good:#8fd18a; --warn:#fbbf6b; --bad:#fb8a9c; --stage:#1c1713; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark; } }
:root[data-theme="dark"]{
  --ink:#f6ece1; --soft:#cbbcab; --muted:#a8998a; --pink:#f9a8d4; --line:rgba(246,236,225,.14);
  --card:rgba(33,28,23,.93); --solid:#211c17; --ground:#171310; --chip:#2c251f; --btn:#2c251f;
  --good:#8fd18a; --warn:#fbbf6b; --bad:#fb8a9c; --stage:#1c1713; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark; }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ground);color:var(--ink);font-family:'DM Sans',system-ui,-apple-system,sans-serif}
button,select{font-family:inherit}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.serif{font-family:'Libre Bodoni',Georgia,'Times New Roman',serif}

/* stage */
#stage{position:fixed;inset:0;background:var(--stage);overflow:hidden}
#stage img{position:absolute;inset:0;width:100%;height:100%;max-width:100%;object-fit:cover;opacity:0;will-change:transform,opacity}
#stage img.hero{transition:opacity .6s ease, transform 1s cubic-bezier(.6,0,.25,1)}
#stage img.hero.fit{object-fit:contain}
#stage img.zone{transition:opacity .9s ease, transform 1.4s cubic-bezier(.2,.7,.2,1);transform:scale(1.14)}
#stage img.on{opacity:1}
#stage img.zone.on{transform:scale(1)}
#stage img.zone.exact,#stage img.zone.exact.on{transform:none;transition:opacity .55s ease}
#stage img.zone.drift{transform:scale(1.05);transition:opacity .9s ease, transform 9s ease-out}
#stage .scrim{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(20,16,12,.38) 0%,rgba(20,16,12,0) 26%,rgba(20,16,12,0) 58%,rgba(20,16,12,.55) 100%)}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
body.plan #stage img,body.plan #stage .scrim,body.plan #spots{display:none}

/* brand + space card */
.brand{position:fixed;left:18px;top:calc(16px + env(safe-area-inset-top,0px));z-index:5;width:min(390px,calc(100vw - 36px))}
.brand .eyebrow{font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#fde2ec;text-shadow:0 1px 8px rgba(0,0,0,.35)}
.brand h1{font-family:'Libre Bodoni',Georgia,serif;font-weight:500;font-size:clamp(32px,4.4vw,50px);line-height:1;margin:4px 0 10px;color:#fffaf4;text-shadow:0 2px 18px rgba(0,0,0,.35)}
body.plan .brand .eyebrow{color:var(--pink);text-shadow:none} body.plan .brand h1{color:var(--ink);text-shadow:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.space{padding:12px 14px}
.space .row{display:flex;align-items:center;gap:8px}
.icon{width:34px;height:34px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--btn);color:var(--ink);cursor:pointer;font-size:16px;line-height:1}
.space select{flex:1;min-width:0;font-size:15px;font-weight:600;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--btn)}
.space .addr{margin:10px 2px 0;font-weight:700;font-size:15px}
.space .sub{margin:2px 2px 0;font-size:13px;color:var(--soft);line-height:1.45;font-variant-numeric:tabular-nums}
.space .acts{display:flex;gap:8px;margin-top:10px}
.pillbtn{font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--btn);color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.pillbtn.primary{background:var(--ink);color:var(--solid);border-color:var(--ink)}

/* caption */
.caption{position:fixed;left:18px;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:5;width:min(400px,calc(100vw - 36px));padding:16px 18px}
.caption .eb{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--pink)}
.caption h2{font-family:'Libre Bodoni',Georgia,serif;font-weight:500;font-size:34px;line-height:1.05;margin:6px 0 8px;text-wrap:balance}
.caption p{margin:0 0 8px;color:var(--soft);font-size:15px;line-height:1.5}
.caption ul{margin:0;padding-left:18px;font-size:14px;line-height:1.55;color:var(--ink);font-variant-numeric:tabular-nums}
.caption .cap{margin-top:8px;font-size:11px;color:var(--muted)}

/* bottom bar */
.bar{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:6;display:flex;gap:4px;flex-wrap:wrap;justify-content:center;padding:6px;border-radius:999px;max-width:calc(100vw - 20px)}
.bar button{font-size:14px;font-weight:600;border:0;border-radius:999px;padding:9px 12px;cursor:pointer;background:transparent;color:var(--ink);display:flex;align-items:center;gap:7px;white-space:nowrap}
.bar button:hover{background:var(--chip)}
.bar button.on{background:var(--ink);color:var(--solid)}
.bar .dot{width:10px;height:10px;border-radius:50%;display:inline-block;border:1px solid rgba(38,33,27,.25)}
.bar .sep{width:1px;background:var(--line);margin:4px 2px}

/* 3D tags */
.tag{position:fixed;z-index:4;transform:translate(-50%,-100%);cursor:pointer;user-select:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 12px 7px;text-align:center;box-shadow:var(--shadow);white-space:nowrap;color:var(--ink)}
.tag b{display:block;font-family:'Libre Bodoni',Georgia,serif;font-size:18px;font-weight:600;line-height:1.1}
.tag span{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.tag i{position:absolute;left:50%;bottom:-6px;width:10px;height:10px;background:var(--solid);border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.tag.dim{opacity:.35}
.tag.lvl{cursor:default;background:#26211b;color:#fbf3ea;padding:5px 10px}.tag.lvl b{font-size:14px;font-family:'DM Sans',sans-serif}.tag.lvl i{background:#26211b;border:0}
body:not(.plan) #tags{display:none}

/* drawer */
.drawer{position:fixed;right:14px;top:calc(14px + env(safe-area-inset-top,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100vw - 28px));z-index:8;
  background:var(--solid);border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 50px rgba(20,16,12,.28);display:flex;flex-direction:column;transform:translateX(115%);transition:transform .35s ease}
.drawer.open{transform:none}
.drawer header{padding:16px 18px 0;display:flex;gap:10px;align-items:flex-start}
.drawer header .t{flex:1;min-width:0}
.drawer header .eb{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--pink)}
.drawer header h2{font-family:'Libre Bodoni',Georgia,serif;font-weight:500;font-size:28px;line-height:1.1;margin:4px 0 0;text-wrap:balance}
.tabs{display:flex;gap:4px;padding:12px 18px 0;border-bottom:1px solid var(--line)}
.tabs button{font-size:14px;font-weight:600;border:0;background:transparent;color:var(--soft);padding:10px 12px;border-bottom:2px solid transparent;cursor:pointer}
.tabs button.on{color:var(--ink);border-bottom-color:var(--pink)}
.dbody{overflow:auto;padding:16px 18px 22px;flex:1}
.dbody h3{font-family:'Libre Bodoni',Georgia,serif;font-weight:500;font-size:20px;margin:18px 0 8px}
.dbody h3:first-child{margin-top:0}
.dbody p{margin:0 0 10px;color:var(--soft);font-size:14px;line-height:1.55}
.dbody ul{margin:0 0 6px;padding-left:18px;font-size:14px;line-height:1.6}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:14px;font-variant-numeric:tabular-nums}
.kv dt{color:var(--soft)} .kv dd{margin:0;text-align:right;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:6px}
.tile{background:var(--chip);border-radius:14px;padding:12px 14px}
.tile .v{font-family:'Libre Bodoni',Georgia,serif;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .l{font-size:12px;color:var(--soft);margin-top:4px;line-height:1.35}
.neg{color:var(--bad)} .pos{color:var(--good)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:700;border-radius:999px;padding:5px 10px;background:var(--chip);color:var(--ink)}
.chip.s-Strong{box-shadow:inset 0 0 0 1.5px var(--good)} .chip.s-Good{box-shadow:inset 0 0 0 1.5px var(--good)}
.chip.s-OK,.chip.s-Stretch,.chip.s-Unknown{box-shadow:inset 0 0 0 1.5px var(--warn)} .chip.s-Weak{box-shadow:inset 0 0 0 1.5px var(--bad)}
.tbl{overflow-x:auto;margin:0 0 6px}
.tbl table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left;white-space:normal}
.tbl th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);font-weight:700}
.tbl tr.total td{font-weight:700;border-bottom:0;border-top:1.5px solid var(--ink)}
.tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:var(--chip)} .tbl tr.cur td{background:var(--chip)}
.tbl .basis{display:block;font-size:11px;color:var(--muted);font-weight:400}
.map{width:100%;height:220px;border:0;border-radius:14px;display:block;margin:0 0 10px;background:var(--chip)}
.fine{font-size:12px!important;color:var(--muted)!important}
.private{display:flex;gap:8px;align-items:flex-start;background:var(--chip);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--soft);margin:0 0 12px;line-height:1.45}
.load{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:var(--ground);transition:opacity .5s ease}
.load div{font-family:'Libre Bodoni',Georgia,serif;font-size:24px;color:var(--soft)}
.load.gone{opacity:0;pointer-events:none}
@media (prefers-reduced-motion: reduce){#stage img{transition:none}#stage img.kb{animation:none}.drawer{transition:none}}
@media (max-width:760px){
  .brand{left:10px;top:calc(10px + env(safe-area-inset-top,0px));width:calc(100vw - 20px)} .brand h1{font-size:28px;margin:2px 0 6px}
  .space{padding:9px 10px} .space .sub{display:none} .space .addr{margin-top:6px;font-size:14px}
  .caption{left:10px;width:calc(100vw - 20px);bottom:calc(74px + env(safe-area-inset-bottom,0px));padding:12px 14px} .caption h2{font-size:26px} .caption ul{display:none} .caption p{font-size:14px;margin:0}
  .bar{bottom:calc(10px + env(safe-area-inset-bottom,0px));gap:0;padding:4px}.bar button{padding:8px 8px;font-size:13px}.bar .lbl{display:none}
  .drawer{left:8px;right:8px;width:auto;top:calc(8px + env(safe-area-inset-top,0px));bottom:calc(64px + env(safe-area-inset-bottom,0px));transform:translateY(115%)} .drawer.open{transform:none}
  .tag b{font-size:14px}.tag span{display:none}
}

/* zone markers on the overview */
#spots{position:absolute;inset:0;pointer-events:none;transition:opacity .35s ease}
#spots.gone{opacity:0}
.spot{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;border:0;background:transparent;padding:0;display:flex;align-items:center;gap:8px;color:var(--ink)}
.spot .ring{width:22px;height:22px;border-radius:50%;background:var(--zc);border:3px solid #fffaf4;box-shadow:0 0 0 0 rgba(255,250,244,.8),0 4px 14px rgba(20,16,12,.35);animation:pulse 2.4s ease-out infinite;flex:none}
.spot .pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 10px;box-shadow:var(--shadow);white-space:nowrap;text-align:left;line-height:1.15}
.spot .pill b{display:block;font-family:'Libre Bodoni',Georgia,serif;font-size:17px;font-weight:600}
.spot .pill span{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.spot:hover .pill,.spot:focus-visible .pill{border-color:var(--ink)}
.spot:hover .ring{transform:scale(1.15)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,250,244,.85),0 4px 14px rgba(20,16,12,.35)}70%{box-shadow:0 0 0 16px rgba(255,250,244,0),0 4px 14px rgba(20,16,12,.35)}100%{box-shadow:0 0 0 0 rgba(255,250,244,0),0 4px 14px rgba(20,16,12,.35)}}
.bar .grp{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:center}
.bar .where{font-size:13px;font-weight:700;padding:0 6px;min-width:120px;text-align:center;font-variant-numeric:tabular-nums}
/* projections */
.verdict{border-radius:14px;padding:12px 14px;margin:0 0 12px;font-size:14px;line-height:1.5;background:var(--chip)}
.verdict b{display:block;font-family:'Libre Bodoni',Georgia,serif;font-size:19px;font-weight:600;margin-bottom:2px}
.verdict.ok{box-shadow:inset 4px 0 0 var(--good)} .verdict.warn{box-shadow:inset 4px 0 0 var(--warn)} .verdict.bad{box-shadow:inset 4px 0 0 var(--bad)}
.tbl td.over{color:var(--bad);font-weight:700}
.tbl td.muted{color:var(--muted)}
.chart{width:100%;height:auto;display:block;margin:4px 0 6px}
.chart text{font-family:'DM Sans',system-ui,sans-serif;font-size:11px;fill:var(--soft)}
.chart .lab{font-weight:700;font-size:11px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--soft);margin:0 0 8px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.levers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 6px}
@media (max-width:760px){ .spot .pill span{display:none} .spot .pill{padding:5px 10px} .spot .pill b{font-size:14px} .bar .where{min-width:0} .levers{grid-template-columns:1fr} }
@media (prefers-reduced-motion: reduce){ .spot .ring{animation:none} #stage img.hero,#stage img.zone{transition:opacity .2s linear} }
</style>

<body>
<div id="stage">
  <img id="heroA" class="hero" alt="">
  <img id="heroB" class="hero" alt="">
  <img id="zA" class="zone" alt="">
  <img id="zB" class="zone" alt="">
  <div class="scrim"></div>
  <div id="spots" aria-label="Zones in this space"></div>
</div>
<canvas id="scene" hidden aria-label="3D test-fit of the selected space"></canvas>
<div class="load" id="load"><div>Raising the roof…</div></div>

<div class="brand">
  <div class="eyebrow">Grateful Giraffes · Concept</div>
  <h1>The Safari</h1>
  <div class="card space">
    <div class="row">
      <button class="icon" id="sPrev" aria-label="Previous space">‹</button>
      <select id="sPick" aria-label="Choose a space"></select>
      <button class="icon" id="sNext" aria-label="Next space">›</button>
    </div>
    <div class="addr" id="sAddr"></div>
    <div class="sub" id="sSub"></div>
    <div class="acts">
      <button class="pillbtn primary" id="bDetails">Property &amp; projections</button>
      <a class="pillbtn" id="bMap" href="#" target="_blank" rel="noopener">Map ↗</a>
      <a class="pillbtn" id="bSwap" href="buy/">Buy options</a>
    </div>
  </div>
</div>

<div id="tags"></div>

<section class="card caption" id="caption" aria-live="polite">
  <div class="eb" id="cEb"></div>
  <h2 id="cH"></h2>
  <p id="cP"></p>
  <ul id="cL"></ul>
  <div class="cap" id="cCap"></div>
</section>

<nav class="card bar" id="bar" aria-label="Tour controls">
  <div class="grp" id="gOverview">
    <button id="bPrevSpace" aria-label="Previous space">‹ <span class="lbl">Prev space</span></button>
    <button id="bTour">▶ <span class="lbl">Tour</span></button>
    <button id="bMode" title="Switch between photos and the 3D plan">3D plan</button>
    <button id="bWalls" title="Raise or lower the walls" hidden>Walls</button>
    <button id="bNextSpace" aria-label="Next space"><span class="lbl">Next space</span> ›</button>
  </div>
  <div class="grp" id="gZone" hidden>
    <button id="bBack">⤢ <span class="lbl">Zoom out</span></button>
    <button id="bPause" hidden>❚❚ <span class="lbl">Pause</span></button>
    <button id="bPrevZone" aria-label="Previous zone">‹</button>
    <span class="where" id="zWhere"></span>
    <button id="bNextZone" aria-label="Next zone">›</button>
    <button id="bInside">↘ <span class="lbl">Step inside</span></button>
    <button id="bNextSpace2"><span class="lbl">Next space</span> →</button>
  </div>
</nav>

<aside class="drawer" id="drawer" aria-label="Property and projections">
  <header>
    <div class="t"><div class="eb" id="dEb"></div><h2 id="dH"></h2></div>
    <button class="icon" id="dClose" aria-label="Close details">×</button>
  </header>
  <div class="tabs" role="tablist">
    <button data-tab="numbers" class="on" role="tab">Projections</button>
    <button data-tab="listing" role="tab">Listing</button>
    <button data-tab="all" role="tab">All ten</button>
  </div>
  <div class="dbody" id="dBody"></div>
</aside>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    <div class="tile"><div class="v">${c.acacia}</div><div class="l">Acacia founder seats</div></div>
    <div class="tile"><div class="v">${c.oasis}</div><div class="l">Oasis café and lounge seats</div></div></div>
  <h3>Fit</h3><div class="chips">${Object.entries(s.scores).map(([k, v]) => `<span class="chip s-${esc(v)}">${esc(k)}: ${esc(v)}</span>`).join('')}</div>
  ${s.watch.length ? `<h3>Watch-outs</h3><ul>${s.watch.map(w => `<li>${esc(w)}</li>`).join('')}</ul>` : ''}
  <p class="fine" style="margin-top:14px">Listing data from SquareFoot, pulled Sept 23 2026. Asking terms change or get withdrawn; confirm with the listing broker.</p>`;
}
function allHTML() {
  const rows = SPACES.map((s, i) => { const rt = s.returns.cases; return `<tr class="click${i === idx ? ' cur' : ''}" data-i="${i}"><td><b>${s.n}. ${esc(s.addr)}</b><span class="basis">${esc(s.hood)} · ${s.sf.toLocaleString()} sq ft</span></td><td>${short(s.rentYr)}${s.askMo ? '' : '*'}</td><td>${short(s.budgetTotal)}</td><td class="${cls(s.scenarios.base.noi)}">${short(s.scenarios.base.noi)}</td><td>${s.scenarios.base.noi >= 0 ? 'At base' : '+' + s.path.breakevenLift + '%'}</td><td class="${cls(s.scenarios.upside.noi)}">${short(s.scenarios.upside.noi)}</td><td class="${pcls(rt.base.irrSale)}">${pct(rt.base.irrSale)}</td><td class="${pcls(rt.upside.irrSale)}">${pct(rt.upside.irrSale)}</td><td class="${pcls(rt.plan.irrSale)}">${pct(rt.plan.irrSale)}</td></tr>`; });
  return `<p>Tap a row to open that space.</p>${tbl(['Space', 'Rent / yr', 'To open', 'Base NOI', 'Break-even', 'Upside NOI', 'Base IRR', 'Upside IRR', 'Plan IRR'], rows)}
  <p class="fine">NOI is a stabilized year. Break-even shows the revenue lift over base it needs. IRR is five years on the cost to open, selling at 3× year-5 NOI; the plan is the $150K NOI case. * Rent not listed; assumed at the Santa Monica median of $59 per sq ft a year.</p>`;
}
function renderDrawer() {
  const s = SPACES[idx];
  $('#dEb').textContent = `Space ${s.n} of 10 · ${s.hood}`; $('#dH').textContent = s.addr;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $('#dBody').innerHTML = tab === 'numbers' ? numbersHTML(s) : tab === 'all' ? allHTML() : listingHTML(s);
  $('#dBody').scrollTop = 0;
  $('#dBody').querySelectorAll('tr.click').forEach(r => r.onclick = () => { stopTour(); loadSpace(+r.dataset.i); });
}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { tab = b.dataset.tab; renderDrawer(); });
$('#bDetails').onclick = () => { $('#drawer').classList.add('open'); renderDrawer(); };
$('#dClose').onclick = () => $('#drawer').classList.remove('open');

// ---------- wiring ----------
$('#bTour').onclick = startTour;
$('#bPause').onclick = () => stopTour();
$('#bInside').onclick = () => { stopTour(); if (busy || view === 'hero') return; sub === 'inside' ? stepBack(view) : stepInside(view); };
$('#bMode').onclick = () => setMode(mode === 'plan' ? 'photos' : 'plan');
$('#bWalls').onclick = () => setWalls(!wallsTall);
$('#bBack').onclick = () => { stopTour(); goOverview(); };
$('#bPrevZone').onclick = () => { stopTour(); stepZone(-1); };
$('#bNextZone').onclick = () => { stopTour(); stepZone(1); };
$('#bPrevSpace').onclick = $('#sPrev').onclick = () => { stopTour(); loadSpace(idx - 1); };
$('#bNextSpace').onclick = $('#bNextSpace2').onclick = $('#sNext').onclick = () => { stopTour(); loadSpace(idx + 1); };
pick.onchange = () => { stopTour(); loadSpace(+pick.value); };
controls.addEventListener('start', () => { anim = null; controls.autoRotate = false; stopTour(); });
addEventListener('keydown', e => { if (e.target.tagName === 'SELECT') return;
  if (e.key === 'Escape') { if ($('#drawer').classList.contains('open')) $('#drawer').classList.remove('open'); else { stopTour(); goOverview(); } }
  if (e.key === 'ArrowRight') { stopTour(); view === 'hero' ? loadSpace(idx + 1) : stepZone(1); }
  if (e.key === 'ArrowLeft') { stopTour(); view === 'hero' ? loadSpace(idx - 1) : stepZone(-1); } });
addEventListener('hashchange', () => { const m = location.hash.match(/^#s(\d+)(?:-([a-z]+))?(-in)?$/); if (!m) return; const n = +m[1];
  if (n >= 1 && n <= SPACES.length && n - 1 !== idx) loadSpace(n - 1).then(() => m[2] && goZone(m[2], !!m[3])); });

const v3 = new THREE.Vector3();
function placeTags() { const w = canvas.clientWidth, h = canvas.clientHeight;
  for (const [k, t] of Object.entries(tags)) { v3.copy(t.p).project(camera); t.el.style.display = v3.z < 1 ? '' : 'none';
    t.el.style.left = ((v3.x + 1)/2*w) + 'px'; t.el.style.top = ((1 - v3.y)/2*h) + 'px'; if (!t.lvl) t.el.classList.toggle('dim', view !== 'hero' && view !== k); } }
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w/h; camera.fov = w < 760 ? 52 : 38; camera.updateProjectionMatrix();
  heroes.forEach(hh => hh.classList.toggle('fit', fitHero())); if (view === 'hero') drawSpots(); else if (mode !== 'plan') { heroFront.style.transition = 'none'; heroFront.style.transform = cropTransform(view); } }
addEventListener('resize', resize); resize();
function tick(now) {
  if (mode === 'plan') {
    if (anim) { const t = Math.min(1, (now - anim.t0)/anim.dur), k = ease(t); camera.position.lerpVectors(anim.p0, anim.p1, k); controls.target.lerpVectors(anim.l0, anim.l1, k); if (t >= 1) anim = null; }
    controls.update(); renderer.render(scene, camera); placeTags();
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const hm = location.hash.match(/^#s(\d+)(?:-([a-z]+))?(-in)?$/), queryN = +(new URLSearchParams(location.search).get('space') || 0);
const startN = hm ? +hm[1] : queryN, startZone = (hm && hm[2]) || new URLSearchParams(location.search).get('zone');
loadSpace(startN >= 1 && startN <= SPACES.length ? startN - 1 : 0).then(() => { if (startZone && ZONES[startZone]) setTimeout(() => goZone(startZone, !!(hm && hm[3])), 500); });

</script>
</body>

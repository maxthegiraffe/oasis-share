<!-- The AI door (Max, 2026-11-06: the webinar text links here, on its own line). Opens Messages to Gigi's (516) 419-7249 line
     with AI already typed; Gigi runs the coaching (gigi-whatsapp functions/ai_discovery.private.js). iOS takes "&body=",
     everyone else "?body=". Add ?stay to look at the page without Messages opening. -->
<script>
  var SMS = /iPad|iPhone|iPod|Macintosh/.test(navigator.userAgent) ? "sms:+15164197249&body=AI" : "sms:+15164197249?body=AI";
  if (!/[?&]stay\b/.test(location.search)) setTimeout(function(){ try{ window.location.href = SMS; }catch(e){} }, 400);
  document.addEventListener("DOMContentLoaded", function(){
    document.querySelectorAll("a[data-sms]").forEach(function(a){ a.href = SMS; });
    if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) {
      var v = document.querySelector("video"); if (v) { v.removeAttribute("autoplay"); v.pause(); }
    }
  });
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #fff4e4; --soft: rgba(255, 244, 228, .82); --gold: #ffc878; --gold-hi: #ffd79c; --night: #0c0a18;
    --serif: "Fraunces", Georgia, serif; --sans: "Inter", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--night); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }

  /* Phone first: Gigi fills the top of the screen, the words and the button sit under her, in thumb reach. */
  .stage { position: relative; isolation: isolate; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end;
    min-height: 100vh; min-height: 100svh; }
  .backdrop { position: absolute; z-index: -3; inset: -60px; width: calc(100% + 120px); height: calc(100% + 120px); object-fit: cover;
    filter: blur(40px) brightness(.42) saturate(1.15); }
  .her { position: absolute; z-index: -2; top: 0; left: 0; width: 100%; height: 66vh; height: 66svh; object-fit: cover; object-position: 50% 0;
    -webkit-mask-image: linear-gradient(180deg, #000 66%, transparent 100%);
            mask-image: linear-gradient(180deg, #000 66%, transparent 100%); }

  .copy { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; width: 100%; max-width: 560px; margin: 0 auto;
    padding: 0 20px max(18px, env(safe-area-inset-bottom)); }
  /* The dark behind the words rides with the words, so they read at any screen height. */
  .copy::before { content: ""; position: absolute; z-index: -1; top: -96px; bottom: 0; left: -100vw; right: -100vw; pointer-events: none;
    background: linear-gradient(180deg, rgba(12,10,24,0), rgba(12,10,24,.8) 96px, rgba(12,10,24,.92) 100%); }
  .eye { margin: 0 0 8px; font-size: 13px; font-weight: 500; letter-spacing: .02em; color: var(--gold); }
  h1 { margin: 0 0 10px; font-family: var(--serif); font-weight: 600; line-height: 1.04; text-wrap: balance;
    font-size: clamp(32px, min(10.4vw, 5.8svh), 56px); }
  .lede { margin: 0 0 16px; max-width: 32em; font-size: clamp(15px, 2.1svh, 18px); line-height: 1.42; color: var(--soft); text-wrap: pretty; }

  .btn { display: flex; align-items: center; justify-content: center; width: 100%; max-width: 420px; min-height: 58px; padding: 0 28px;
    border-radius: 999px; background: var(--gold); color: #1a1208; font-size: 18px; font-weight: 600; text-decoration: none;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .36); transition: transform .14s ease, background-color .14s ease, box-shadow .14s ease; }
  .btn:active { transform: scale(.98); }
  @media (hover: hover) {
    .btn:hover { background: var(--gold-hi); transform: translateY(-2px); box-shadow: 0 12px 30px rgba(0, 0, 0, .42); }
    .btn:hover:active { transform: scale(.98); }
    .num:hover { color: var(--ink); }
  }
  .btn:focus-visible, .num:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  .note { margin: 10px 0 0; font-size: 13.5px; line-height: 1.45; color: var(--soft); }
  .num { color: var(--gold); text-underline-offset: 3px; white-space: nowrap; transition: color .14s ease; }

  /* Wide screens: the words on the left, Gigi at full height on the right, melting into the dusk. */
  @media (min-aspect-ratio: 5/4) {
    .stage { justify-content: center; }
    .backdrop { display: none; }
    .her { top: 0; left: auto; right: -9vw; width: 100vh; width: 100svh; height: 100%; object-position: 50% 50%;
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 30%);
              mask-image: linear-gradient(90deg, transparent, #000 30%); }
    .copy::before { display: none; }
    .copy { align-items: flex-start; text-align: left; width: min(44vw, 560px); max-width: none; margin: 0 0 0 clamp(28px, 6vw, 112px); padding: 16px 0; }
    .eye { font-size: 15px; margin-bottom: 12px; }
    h1 { font-size: clamp(30px, min(4.9vw, 9svh), 76px); margin-bottom: 16px; }
    .lede { font-size: clamp(15px, min(1.4vw, 2.5svh), 20px); margin-bottom: 24px; }
    .btn { width: min(360px, 100%); }
    .note { margin-top: 14px; font-size: 14px; }
  }
  @media (max-height: 440px) { .lede { display: none; } h1 { margin-bottom: 12px; } }
  @media (prefers-reduced-motion: reduce) { .btn, .num { transition: none; } .btn:hover { transform: none; } }
</style>
</head>
<body>
  <div class="stage">
    <img class="backdrop" src="/gigi/poster.jpg" alt="" aria-hidden="true">
    <video class="her" autoplay muted loop playsinline preload="metadata" poster="/gigi/poster.jpg" aria-hidden="true" tabindex="-1">
      <source src="/gigi/gigi.mp4" type="video/mp4">
    </video>
    <main class="copy">
      <p class="eye">By text, with Gigi</p>
      <h1>Your free AI coaching call</h1>
      <p class="lede">A few quick questions about your work and where your hours go. Then Gigi sends back a short AI roadmap and one first step you can take this week.</p>
      <a class="btn" data-sms href="sms:+15164197249">Text AI to Gigi</a>
      <p class="note">Messages opens with AI typed in. Just hit send.<br>Or text AI to <a class="num" data-sms href="sms:+15164197249">(516) 419-7249</a></p>
    </main>
  </div>
</body>
</html>
